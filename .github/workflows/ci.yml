name: Check packaging

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate .toc, Lua 5.1 syntax, icon, changelog, and release workflow
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
          lua5.1 tools/check_packaging.lua
