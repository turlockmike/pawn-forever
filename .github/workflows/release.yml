# Push a tag like v1.0.1 to release:
#   1. builds PawnForever-v1.0.1.zip (the PawnForever folder, with the version stamped into the .toc)
#   2. creates a GitHub release with that zip and the matching CHANGELOG.md section
#   3. uploads it to CurseForge when the repo has these set (Settings > Secrets and variables > Actions):
#        secret   CF_API_TOKEN          - https://legacy.curseforge.com/account/api-tokens
#        variable CF_PROJECT_ID         - number on the CurseForge project page
#        variable CF_GAME_VERSION_IDS   - comma-separated CurseForge game version IDs, e.g. "12345"
#                                         (list them: curl -H "X-Api-Token: $TOKEN" https://wow.curseforge.com/api/game/versions)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          VERSION="${TAG#v}"
          sed -i "s/^## Version: .*/## Version: ${VERSION}/" PawnForever/PawnForever.toc
          grep -q "^## Version: ${VERSION}" PawnForever/PawnForever.toc
          cp LICENSE PawnForever/LICENSE.txt
          zip -r "PawnForever-${TAG}.zip" PawnForever
          # Release notes: the CHANGELOG.md section for this version (falls back to the tag name).
          awk -v v="$VERSION" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Pawn Forever ${TAG}" > notes.md
          cat notes.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "PawnForever-${TAG}.zip" --title "Pawn Forever ${TAG}" --notes-file notes.md

      - name: CurseForge upload
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_GAME_VERSION_IDS: ${{ vars.CF_GAME_VERSION_IDS }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_PROJECT_ID" ] || [ -z "$CF_GAME_VERSION_IDS" ]; then
            echo "CurseForge settings not configured; skipping upload."
            exit 0
          fi
          METADATA=$(jq -n --rawfile notes notes.md --arg name "Pawn Forever ${TAG}" --arg ids "$CF_GAME_VERSION_IDS" \
            '{changelog: $notes, changelogType: "markdown", releaseType: "release", displayName: $name,
              gameVersions: ($ids | split(",") | map(gsub(" "; "") | tonumber))}')
          curl --fail-with-body -sS \
            -H "X-Api-Token: ${CF_API_TOKEN}" \
            -F "metadata=${METADATA}" \
            -F "file=@PawnForever-${TAG}.zip" \
            "https://wow.curseforge.com/api/projects/${CF_PROJECT_ID}/upload-file"
